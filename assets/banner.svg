<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Kedai Pujasera Digital - Kelompok 11">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d47a1"><animate attributeName="stop-color" values="#0d47a1;#1565c0;#0d47a1" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00b4ff"><animate attributeName="stop-color" values="#00b4ff;#4fc3f7;#00b4ff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.18">
    <circle cx="120" cy="260" r="14"><animate attributeName="cy" values="270;40;270" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="280" r="9"><animate attributeName="cy" values="280;60;280" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="270" r="18"><animate attributeName="cy" values="270;30;270" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="285" r="10"><animate attributeName="cy" values="285;50;285" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="270" r="16"><animate attributeName="cy" values="270;40;270" dur="10s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="2">
    KEDAI PUJASERA DIGITAL
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e3f2fd" text-anchor="middle">
    <text x="500" y="178" opacity="0">Proyek Kelompok 11
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="500" y="178" opacity="0">Teknik Informatika · Universitas Samudra
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" begin="-4s" repeatCount="indefinite"/></text>
    <text x="500" y="178" opacity="0">Menu · Foto Produk · Harga · Informasi Kedai
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" begin="-8s" repeatCount="indefinite"/></text>
  </g>
  <path d="M0 235 Q 125 195 250 235 T 500 235 Q 625 195 750 235 T 1000 235 Q 1125 195 1250 235 T 1500 235 Q 1625 195 1750 235 T 2000 235 V 300 H 0 Z" fill="#ffffff" opacity="0.25">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path d="M0 255 Q 125 215 250 255 T 500 255 Q 625 215 750 255 T 1000 255 Q 1125 215 1250 255 T 1500 255 Q 1625 215 1750 255 T 2000 255 V 300 H 0 Z" fill="#ffffff" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M0 275 Q 125 235 250 275 T 500 275 Q 625 235 750 275 T 1000 275 Q 1125 235 1250 275 T 1500 275 Q 1625 235 1750 275 T 2000 275 V 300 H 0 Z" fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="7s" repeatCount="indefinite"/>
  </path>
</svg>
